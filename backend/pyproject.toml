[project]
name = "tafahhum"
version = "0.1.0"
description = "A research platform for the historical tradition of Quranic interpretation"
authors = [{ name = "Sudais Khalid" }]
readme = "../README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Embedding and reranking models are heavy and optional: the corpus, retrieval
# schema, and sparse search all work without them, so a contributor working on
# ingestion or the API does not need to pull PyTorch.
ml = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
tafahhum-migrate = "tafahhum.db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tafahhum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: requires a live PostgreSQL instance",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguous-unicode: Arabic text is the point

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
