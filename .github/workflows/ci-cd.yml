name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Only the newest run per branch matters; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The publish job widens this for itself only.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  backend:
    name: Backend — lint and test
    runs-on: ubuntu-latest

    # Tests run against a real PostgreSQL with pgvector, because the schema
    # depends on extensions, generated columns, triggers, and CHECK constraints
    # that a stub would not reproduce.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tafahhum
          POSTGRES_USER: tafahhum
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U tafahhum -d tafahhum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TAFAHHUM_POSTGRES_HOST: localhost
      TAFAHHUM_POSTGRES_PORT: 5544
      TAFAHHUM_POSTGRES_DB: tafahhum
      TAFAHHUM_POSTGRES_USER: tafahhum
      TAFAHHUM_POSTGRES_PASSWORD: ci_only_not_a_secret

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Apply migrations
        working-directory: backend
        run: uv run python -m tafahhum.db.migrate

      - name: Test
        working-directory: backend
        # Database-backed tests skip cleanly when Postgres is unreachable, so a
        # green run here means they actually executed.
        run: uv run pytest -q

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: frontend
        # Type errors fail the Next.js build, so this is the type check too.
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies and config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          # Report everything, fail on nothing: a CVE in a transitive dependency
          # should be visible without blocking an unrelated change. Tighten to
          # exit-code 1 once the backlog is at zero.
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    # Only after everything passes, and only from the default branch — a PR
    # build must never publish an image.
    needs: [backend, frontend, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically; no registry secret to manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
