name: tafahhum

services:
  db:
    # pgvector ships an image tracking upstream PostgreSQL; pinning both the
    # Postgres major and the pgvector version keeps index behaviour reproducible.
    image: pgvector/pgvector:pg17
    container_name: tafahhum-db
    environment:
      POSTGRES_DB: tafahhum
      POSTGRES_USER: tafahhum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tafahhum_dev}
      # Arabic collation. ICU gives correct ordering for Arabic-script text,
      # which the default C collation does not.
      POSTGRES_INITDB_ARGS: >-
        --locale-provider=icu
        --icu-locale=und
        --encoding=UTF8
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    # Docker defaults /dev/shm to 64MB. PostgreSQL allocates shared memory there
    # for parallel query workers, and against a multi-gigabyte corpus that ceiling
    # is reached as soon as a scan goes parallel — surfacing as DiskFull on an
    # ordinary SELECT, which reads like a full disk and is not one.
    shm_size: 1gb
    volumes:
      - tafahhum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tafahhum -d tafahhum"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # A runaway query on a dev box should not take the whole machine with it.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - postgres
      # Arabic text is token-dense; a larger work_mem keeps GIN scans in memory.
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - shared_buffers=256MB

volumes:
  tafahhum_pgdata:
