# Production stack for Tafahhum.
#
# Run with:  docker compose -f docker-compose.prod.yml up -d
#
# docker-compose.yml stays as the development file — it runs Postgres alone with
# a host port so local tooling can reach it. This file runs the whole system and
# deliberately does not publish the database port: nothing outside the compose
# network needs it, and exposing it on a public VM would be the single largest
# avoidable risk in the deployment.

name: tafahhum

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # The only service bound to the host. Everything else is reachable only on
    # the internal network.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TAFAHHUM_DOMAIN: ${TAFAHHUM_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [edge, internal]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty means same-origin: the browser calls /api on the host it loaded
        # the page from, which Caddy routes to the API.
        NEXT_PUBLIC_TAFAHHUM_API: ""
    image: ${REGISTRY:-ghcr.io/OWNER/tafahhum}-web:${TAG:-latest}
    restart: unless-stopped
    expose: ["3000"]
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging: *logging

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/OWNER/tafahhum}-api:${TAG:-latest}
    restart: unless-stopped
    expose: ["8000"]
    environment:
      TAFAHHUM_POSTGRES_HOST: db
      TAFAHHUM_POSTGRES_PORT: 5432
      TAFAHHUM_POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TAFAHHUM_POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      TAFAHHUM_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Served same-origin behind Caddy, so no cross-origin allowance is needed.
      TAFAHHUM_CORS_ORIGINS: ${TAFAHHUM_CORS_ORIGINS:-}
      # Must stay true on anything user-facing: it is what keeps unpublished and
      # fixture corpus rows out of results.
      TAFAHHUM_PUBLISHED_ONLY: "true"
      TAFAHHUM_ENVIRONMENT: production
      # Optional; absent means translation degrades to a stated 503 rather than
      # failing the request.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Page images are evidence and are read by the scan endpoint. Read-only:
      # the API never writes here, and mounting it writable would let a bug in
      # the ingestion path modify primary evidence.
      - ./data/scans:/data/scans:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging: *logging

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # No `ports:` on purpose. Reach it with:
    #   docker compose -f docker-compose.prod.yml exec db psql -U <user> -d <db>
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: >-
        --locale-provider=icu
        --icu-locale=und
        --encoding=UTF8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - postgres
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - shared_buffers=512MB
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    logging: *logging

networks:
  # Only caddy sits on both; the database is unreachable from outside.
  edge:
  internal:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
